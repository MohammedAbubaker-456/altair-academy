# GitHub Actions Workflow: Production cPanel Package Builder
#
# Builds the standalone Next.js application on a native Ubuntu Linux runner
# with Node 22, generating Linux-compatible Prisma and Sharp native binaries.
# Uploads deploy/altair-academy-cpanel.zip as a downloadable workflow artifact.
#
# Triggers: Push to main, workflow_dispatch (manual trigger)
# Location: .github/workflows/build-cpanel.yml

name: Build cPanel Deployment Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Standalone Package (Linux x64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Assemble cPanel Package
        run: npm run package:cpanel

      - name: Upload cPanel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: altair-academy-cpanel
          path: deploy/altair-academy-cpanel.zip
          retention-days: 14
          if-no-files-found: error
