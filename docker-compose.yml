services:
  mongo:
    image: mongo:7.0
    container_name: altair-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    entrypoint:
      - bash
      - -c
      - |
        mongod --replSet rs0 --bind_ip_all &
        MONGOPID=$$!
        echo "Waiting for MongoDB to accept connections..."
        until mongosh --eval "rs.status()" > /dev/null 2>&1; do
          mongosh --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })" > /dev/null 2>&1
          sleep 1
        done
        echo "MongoDB replica set rs0 is ready!"
        wait $$MONGOPID
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
